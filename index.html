function Icon({ name, className="w-4 h-4", strokeWidth=2, filled=false, style }){
  const content = ICONS[name] || ICONS.circle;
  return (
    <svg viewBox="0 0 24 24" className={className} style={style}
      fill={filled ? "currentColor" : "none"} stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {content}
    </svg>
  );
}

/* ============ Error boundary — never show a blank white screen ============ */
class ErrorBoundary extends React.Component{
  constructor(props){ super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){ console.error('App crashed:', error, info); }
  render(){
    if(this.state.error){
      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-6">
          <div className="max-w-sm text-center">
            <div className="w-14 h-14 mx-auto mb-4 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-500">
              <Icon name="x-circle" className="w-7 h-7" />
            </div>
            <h1 className="text-lg font-bold mb-2 text-slate-800 dark:text-slate-100">畫面發生錯誤</h1>
            <p className="text-[12.5px] text-slate-500 dark:text-slate-400 mb-5 break-words">{String((this.state.error && this.state.error.message) || this.state.error)}</p>
            <button onClick={()=>window.location.reload()} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold active:scale-95 transition-all">重新整理</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============ Constants ============ */
const K_ITEMS = "tt2_items_v1";
const K_COUNTRIES = "tt2_countries_v1";

  "馬來西亞":"🇲🇾","印尼":"🇮🇩","菲律賓":"🇵🇭","印度":"🇮🇳","荷蘭":"🇳🇱","瑞士":"🇨🇭","紐西蘭":"🇳🇿","土耳其":"🇹🇷","杜拜":"🇦🇪"

const DEFAULT_COUNTRIES = ["台灣","日本","美國"];
const DEBOUNCE_MS = 700, RETRY_BASE = 4000, FETCH_TIMEOUT = 15000;

/* Seed data — shown immediately on first load so the UI is never a blank
   canvas (also used by the "一鍵匯入範例資料" button on the empty state). */
const SAMPLE_ITEMS = [
  { country:"日本", category:"restaurant", name:"叙叙苑 燒肉 銀座店", address:"東京都中央区銀座", note:"招牌牛舌跟和牛拼盤必點，價位偏高但很值得 #必吃 #需預約", favorite:true, done:false },

  { country:"日本", category:"shopping", name:"大國藥妝 道頓堀店", address:"大阪府大阪市中央区道頓堀", note:"面膜跟胃藥都比較便宜，記得比價 #伴手禮", favorite:false, done:true },
  { country:"台灣", category:"restaurant", name:"鼎泰豐 信義店", address:"台北市信義區松高路", note:"小籠包跟蛋炒飯經典必點 #必吃 #排隊", favorite:true, done:false }
];

/* ============ Pure helpers ============ */
function uid(){ return 'it_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function loadJSON(key, fallback){ try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function buildSeedItems(){
  const now = Date.now();
  return SAMPLE_ITEMS.map((s, i) => ({
    id: uid(), createdAt: now - (SAMPLE_ITEMS.length - i) * 3600000, updatedAt: now - (SAMPLE_ITEMS.length - i) * 3600000, ...s
  }));
}
function loadItemsWithSeed(){
  // Only seed on a genuinely first-ever load (no key at all). If the user has
  // explicitly cleared their data before, localStorage will hold "[]" (not
  // null), and we correctly respect that empty state instead of reseeding.
  const raw = localStorage.getItem(K_ITEMS);
  if(raw === null) return buildSeedItems();
  try{ const parsed = JSON.parse(raw); return Array.isArray(parsed) ? parsed : buildSeedItems(); }
  catch(e){ return buildSeedItems(); }
}
function isDirectMapsLink(v){ return /^https?:\/\//i.test((v||"").trim()); }
function buildMapsUrl(name, addressOrLink){
  const a = (addressOrLink||"").trim();
  if(isDirectMapsLink(a)) return a;
  const q = [name||"", a].filter(Boolean).join(" ").trim();
  if(!q) return "";
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
function formatDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,'0') + "." + String(d.getDate()).padStart(2,'0');
}
function timeAgo(ts){
  if(!ts) return '尚未同步';
  const diff = Math.max(0, Date.now() - ts);
  const m = Math.floor(diff/60000);
  if(m < 1) return '剛剛同步';
  if(m < 60) return m + ' 分鐘前';
  const h = Math.floor(m/60);
  if(h < 24) return h + ' 小時前';
  return Math.floor(h/24) + ' 天前';
}
function extractTags(note){
  if(!note) return [];
  const matches = note.match(/#([^\s#]+)/g) || [];
  return [...new Set(matches.map(t=>t.slice(1)))];
}
function stripTags(note){ return note ? note.replace(/#[^\s#]+/g,'').trim() : ''; }
function fetchWithTimeout(url, opts={}){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), FETCH_TIMEOUT);
  return fetch(url, Object.assign({}, opts, { signal:controller.signal })).finally(()=>clearTimeout(timer));
}

/* ============ Store hook ============ */
function useTripStore(){
  const [items, setItems] = useState(loadItemsWithSeed);
  const [countries, setCountries] = useState(()=>loadJSON(K_COUNTRIES, DEFAULT_COUNTRIES.slice()));
  const [theme, setTheme] = useState(()=>loadJSON(K_THEME, 'system'));
  const [filters, setFilters] = useState(()=>loadJSON(K_FILTERS, { country:'all', category:'all', status:'all', search:'' }));
  const [gasUrl, setGasUrlState] = useState(()=>localStorage.getItem(K_GAS) || '');
  const [queue, setQueue] = useState(()=>loadJSON(K_QUEUE, []));
  const [lastSyncAt, setLastSyncAt] = useState(()=>Number(localStorage.getItem(K_LASTSYNC)) || 0);
  const [syncing, setSyncing] = useState(false);
  const [online, setOnline] = useState(navigator.onLine);
  const [toast, setToast] = useState(null);
  const [hasLoadedOnce, setHasLoadedOnce] = useState(items.length > 0);

  useEffect(()=>saveJSON(K_ITEMS, items), [items]);
  useEffect(()=>saveJSON(K_COUNTRIES, countries), [countries]);
  useEffect(()=>saveJSON(K_THEME, theme), [theme]);
  useEffect(()=>saveJSON(K_FILTERS, filters), [filters]);
  useEffect(()=>saveJSON(K_QUEUE, queue), [queue]);
  useEffect(()=>localStorage.setItem(K_GAS, gasUrl||''), [gasUrl]);
  useEffect(()=>localStorage.setItem(K_LASTSYNC, String(lastSyncAt)), [lastSyncAt]);

  const gasUrlRef = useRef(gasUrl); useEffect(()=>{ gasUrlRef.current = gasUrl; }, [gasUrl]);
  const onlineRef = useRef(online); useEffect(()=>{ onlineRef.current = online; }, [online]);
  const queueRef = useRef(queue); useEffect(()=>{ queueRef.current = queue; }, [queue]);
  const syncingRef = useRef(false);
  const debounceRef = useRef(null);
  const retryRef = useRef(null);
  const retryDelayRef = useRef(RETRY_BASE);
  const toastTimerRef = useRef(null);

  const showToast = useCallback((msg)=>{
    setToast(msg);
    clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(()=>setToast(null), 2600);
  }, []);

  const applyServerState = useCallback((data)=>{
    if(Array.isArray(data.items)) setItems(data.items);
    if(Array.isArray(data.countries) && data.countries.length) setCountries(data.countries);
    setLastSyncAt(Date.now());
    setHasLoadedOnce(true);
  }, []);

  const doPlainRefresh = useCallback(async ()=>{
    const url = gasUrlRef.current;
    if(!url || !onlineRef.current) return;
    syncingRef.current = true; setSyncing(true);
    try{
      const res = await fetchWithTimeout(url + '?action=list', { method:'GET' });
      const data = await res.json();
      if(!data || data.success === false) throw new Error((data && data.error) || '讀取失敗');
      applyServerState(data);
      showToast('已是最新資料 ✓');
    }catch(err){ showToast('連線失敗，稍後再試'); }
    finally{ syncingRef.current = false; setSyncing(false); }
  }, [applyServerState, showToast]);

  const scheduleRetry = useCallback(()=>{
    clearTimeout(retryRef.current);
    retryRef.current = setTimeout(()=>{
      retryDelayRef.current = Math.min(retryDelayRef.current * 1.6, 60000);
      flushQueue();
    }, retryDelayRef.current);
    // eslint-disable-next-line
  }, []);

  const flushQueue = useCallback(async ()=>{
    const url = gasUrlRef.current;
    if(!url || !onlineRef.current || syncingRef.current) return;
    const batch = queueRef.current.slice();
    if(batch.length === 0){ return doPlainRefresh(); }
    syncingRef.current = true; setSyncing(true);
    try{
      const res = await fetchWithTimeout(url, {
        method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ actions: batch })
      });
      const data = await res.json();
      if(!data || data.success === false) throw new Error((data && data.error) || '同步失敗');
      const sentIds = new Set(batch.map(a=>a.clientId));
      setQueue(q => q.filter(a => !sentIds.has(a.clientId)));
      applyServerState(data);
      retryDelayRef.current = RETRY_BASE;
      showToast('已同步至雲端 ✓');
    }catch(err){
      showToast('同步失敗，將自動重試');
      scheduleRetry();
    }finally{ syncingRef.current = false; setSyncing(false); }
  }, [applyServerState, showToast, doPlainRefresh, scheduleRetry]);

  const scheduleSync = useCallback(()=>{
    if(!gasUrlRef.current) return;
    clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(()=>flushQueue(), DEBOUNCE_MS);
  }, [flushQueue]);

  const queueAction = useCallback((action)=>{
    action.clientId = uid(); action.ts = Date.now();
    setQueue(q => [...q, action]);
    scheduleSync();
  }, [scheduleSync]);

  useEffect(()=>{
    const onOnline = ()=>{ setOnline(true); showToast('已恢復連線，開始同步…'); flushQueue(); };
    const onOffline = ()=>{ setOnline(false); showToast('已離線'); };
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return ()=>{ window.removeEventListener('online', onOnline); window.removeEventListener('offline', onOffline); };
  }, [flushQueue, showToast]);

  useEffect(()=>{
    if(gasUrl && online){ const t = setTimeout(()=>flushQueue(), 400); return ()=>clearTimeout(t); }
    // eslint-disable-next-line
  }, []);

  const pendingIds = useMemo(()=>{
    const s = new Set();
    queue.forEach(a=>{ if(a.type==='upsert-item' && a.payload) s.add(a.payload.id); if(a.type==='delete-item') s.add(a.id); });
    return s;
  }, [queue]);

  /* ---- item CRUD ---- */
  const addItem = useCallback((data)=>{
    const now = Date.now();
    const newItem = Object.assign({ id: uid(), createdAt: now, updatedAt: now, done:false, favorite:false }, data);
    setItems(prev => [...prev, newItem]);
    queueAction({ type:'upsert-item', payload:newItem });
    return newItem;
  }, [queueAction]);

  const updateItem = useCallback((id, patch)=>{
    setItems(prev => {
      const idx = prev.findIndex(it=>it.id===id);
      if(idx===-1) return prev;
      const updated = Object.assign({}, prev[idx], patch, { updatedAt: Date.now() });
      queueAction({ type:'upsert-item', payload: updated });
      const next = prev.slice(); next[idx] = updated; return next;
    });
  }, [queueAction]);

  const toggleDone = useCallback((id)=>{ setItems(prev=>{
    const it = prev.find(x=>x.id===id); if(!it) return prev;
    const updated = Object.assign({}, it, { done:!it.done, updatedAt:Date.now() });
    queueAction({type:'upsert-item', payload:updated});
    return prev.map(x=>x.id===id?updated:x);
  }); }, [queueAction]);

  const toggleFav = useCallback((id)=>{ setItems(prev=>{
    const it = prev.find(x=>x.id===id); if(!it) return prev;
    const updated = Object.assign({}, it, { favorite:!it.favorite, updatedAt:Date.now() });
    queueAction({type:'upsert-item', payload:updated});
    return prev.map(x=>x.id===id?updated:x);
  }); }, [queueAction]);

  const deleteItem = useCallback((id)=>{
    setItems(prev => prev.filter(it => it.id !== id));
    queueAction({ type:'delete-item', id });
  }, [queueAction]);

  const importSampleData = useCallback(()=>{
    SAMPLE_ITEMS.forEach(s => addItem(s));
    setCountries(prev => prev.indexOf('台灣')>-1 ? prev : [...prev, '台灣']);
    showToast('已匯入範例資料 ✨');
  }, [addItem, showToast]);

  /* ---- countries ---- */
  const addCountry = useCallback((name)=>{
    name = (name||'').trim();
    if(!name) return false;
    if(countries.indexOf(name) > -1){ showToast('這個地區已經存在'); return false; }
    setCountries(prev => [...prev, name]);
    queueAction({ type:'upsert-country', name });
    return true;
  }, [countries, queueAction, showToast]);

  const removeCountry = useCallback((name)=>{
    setCountries(prev => prev.filter(c => c !== name));
    queueAction({ type:'delete-country', name });
    setFilters(prev => prev.country === name ? Object.assign({}, prev, { country:'all' }) : prev);
  }, [queueAction]);

  /* ---- sync utility actions ---- */
  const manualSync = useCallback(()=>{
    if(!gasUrl){ showToast('請先在設定中設定同步網址'); return; }
    if(!online){ showToast('目前離線，連線後會自動同步'); return; }
    clearTimeout(debounceRef.current);
    flushQueue();
  }, [gasUrl, online, flushQueue, showToast]);

  const setGasUrl = useCallback((url)=>{ setGasUrlState(url); }, []);

  const saveGasUrlAndSync = useCallback((url)=>{
    setGasUrlState(url);
    gasUrlRef.current = url;
    if(url){ showToast('已儲存，開始同步…'); setTimeout(()=>flushQueue(), 100); }
    else showToast('已清除同步網址');
  }, [flushQueue, showToast]);

  const testConnection = useCallback(async (url)=>{
    if(!url) { showToast('請先輸入網址'); return false; }
    try{
      const res = await fetchWithTimeout(url + '?action=ping', { method:'GET' });
      const data = await res.json();
      if(data && data.pong){ showToast('連線成功 ✓'); return true; }
      showToast('連線異常，請確認網址與部署設定'); return false;
    }catch(e){ showToast('連線失敗，請確認網址與部署權限'); return false; }
  }, [showToast]);

  const uploadOverwriteCloud = useCallback(async ()=>{
    if(!gasUrl){ showToast('請先設定同步網址'); return; }
    syncingRef.current = true; setSyncing(true);
    try{
      const res = await fetchWithTimeout(gasUrl, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ actions:[{ type:'replace-all', clientId:uid(), items, countries }] })
      });
      const data = await res.json();
      if(!data || data.success===false) throw new Error('失敗');
      setQueue([]);
      applyServerState(data);
      showToast('已上傳並覆蓋雲端資料 ✓');
    }catch(e){ showToast('上傳失敗，請檢查連線'); }
    finally{ syncingRef.current=false; setSyncing(false); }
  }, [gasUrl, items, countries, applyServerState, showToast]);

  const downloadOverwriteLocal = useCallback(async ()=>{
    if(!gasUrl){ showToast('請先設定同步網址'); return; }
    syncingRef.current = true; setSyncing(true);
    try{
      const res = await fetchWithTimeout(gasUrl + '?action=list', { method:'GET' });
      const data = await res.json();
      if(!data || data.success===false) throw new Error('失敗');
      setQueue([]);
      applyServerState(data);
      showToast('已用雲端資料覆蓋本機 ✓');
    }catch(e){ showToast('下載失敗，請檢查連線'); }
    finally{ syncingRef.current=false; setSyncing(false); }
  }, [gasUrl, applyServerState, showToast]);

  const exportJSON = useCallback(()=>{
    const payload = { app:"trip-tags", version:2, exportedAt:new Date().toISOString(), countries, items };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'trip-tags-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast('已匯出 JSON 檔案');
  }, [countries, items, showToast]);

  const importJSON = useCallback((file)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.items)) throw new Error('格式不正確');
        const replace = confirm('偵測到 '+data.items.length+' 筆項目。\n按「確定」= 合併到現有資料\n按「取消」= 取代所有現有資料');
        if(replace){
          setItems(data.items);
          setCountries(Array.isArray(data.countries) && data.countries.length ? data.countries : DEFAULT_COUNTRIES.slice());
          data.items.forEach(it => queueAction({ type:'upsert-item', payload: it }));
        } else {
          setItems(prev => {
            const existingIds = new Set(prev.map(it=>it.id));
            const merged = [...prev];
            data.items.forEach(it => {
              const clean = existingIds.has(it.id) ? Object.assign({}, it, { id: uid() }) : it;
              merged.push(clean);
              queueAction({ type:'upsert-item', payload: clean });
            });
            return merged;
          });
          setCountries(prev => {
            const next = [...prev];
            (data.countries||[]).forEach(c => { if(next.indexOf(c)===-1){ next.push(c); queueAction({type:'upsert-country', name:c}); } });
            return next;
          });
        }
        showToast('匯入完成，正在同步至雲端…');
      }catch(e){ showToast('匯入失敗：檔案格式不正確'); }
    };
    reader.readAsText(file);
  }, [queueAction, showToast]);

  const clearLocalData = useCallback(()=>{
    setItems([]); setCountries(DEFAULT_COUNTRIES.slice()); setQueue([]);
    showToast('已清除本機資料');
  }, [showToast]);

  return {
    items, countries, theme, setTheme, filters, setFilters,
    gasUrl, setGasUrl, saveGasUrlAndSync, testConnection,
    queue, pendingIds, lastSyncAt, syncing, online, toast, hasLoadedOnce,
    addItem, updateItem, deleteItem, toggleDone, toggleFav, importSampleData,
    addCountry, removeCountry, manualSync, uploadOverwriteCloud, downloadOverwriteLocal,
    exportJSON, importJSON, clearLocalData
  };
}

}

/* ============ Item Modal ============ */
function ItemModal({ open, onClose, store, editing }){
  const [country, setCountry] = useState('');
  const [category, setCategory] = useState('restaurant');
  const [name, setName] = useState('');
  const [address, setAddress] = useState('');
  const [note, setNote] = useState('');
  const [favorite, setFavorite] = useState(false);
  const [done, setDone] = useState(false);
  const [keepOpen, setKeepOpen] = useState(false);
  const nameRef = useRef(null);

  useEffect(()=>{
    if(!open) return;
    if(editing){
      setCountry(editing.country); setCategory(editing.category); setName(editing.name);
      setAddress(editing.address||''); setNote(editing.note||''); setFavorite(!!editing.favorite); setDone(!!editing.done);
    } else {
      setCountry(store.filters.country!=='all' ? store.filters.country : (store.countries[0]||'台灣'));
      setCategory(store.filters.category!=='all' ? store.filters.category : 'restaurant');
      setName(''); setAddress(''); setNote(''); setFavorite(false); setDone(false); setKeepOpen(false);
    }
    const t = setTimeout(()=>nameRef.current && nameRef.current.focus(), 200);
    return ()=>clearTimeout(t);
  }, [open, editing]);

  if(!open) return null;
  const mapsUrl = buildMapsUrl(name, address);

  function submit(e){
    e.preventDefault();
    if(!name.trim()){ nameRef.current && nameRef.current.focus(); return; }
    if(editing){
      store.updateItem(editing.id, { country, category, name:name.trim(), address:address.trim(), note:note.trim(), favorite, done });
      onClose();
    } else {
      store.addItem({ country, category, name:name.trim(), address:address.trim(), note:note.trim(), favorite, done });
      if(keepOpen){ setName(''); setAddress(''); setNote(''); setFavorite(false); setDone(false); nameRef.current && nameRef.current.focus(); }
      else onClose();
    }
  }
  function handleDelete(){
    if(confirm('確定要刪除這個項目嗎？此動作無法復原，且會從雲端同步刪除。')){
      store.deleteItem(editing.id); onClose();
    }
  }

  return (
    <div className="fixed inset-0 z-[60] flex items-end md:items-center justify-center bg-slate-900/50 backdrop-blur-sm" onClick={onClose}>
      <div onClick={e=>e.stopPropagation()}
        className="w-full md:max-w-lg bg-white dark:bg-slate-900 rounded-t-3xl md:rounded-3xl shadow-soft-md max-h-[92dvh] overflow-y-auto border-t md:border border-slate-200/70 dark:border-slate-700/60 anim-in">
        <div className="sticky top-0 bg-white dark:bg-slate-900 px-6 pt-4 pb-3 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <div className="w-9 h-1 rounded-full bg-slate-200 dark:bg-slate-700 mx-auto absolute left-1/2 -translate-x-1/2 top-2 md:hidden"></div>
          <h2 className="text-lg font-bold pt-2 md:pt-0">{editing ? '編輯項目' : '新增項目'}</h2>
          <button onClick={onClose} className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-90">
            <Icon name="x" className="w-4 h-4" />
          </button>
        </div>

        <form onSubmit={submit} className="px-6 py-5 space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="block text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">國家 / 地區</label>
              <div className="flex gap-1.5">
                <select value={country} onChange={e=>setCountry(e.target.value)}
                  className="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-[14px] outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 dark:focus:ring-indigo-500/10 transition-all">
                  {store.countries.map(c=><option key={c} value={c}>{COUNTRY_FLAGS[c]||'🏳️'} {c}</option>)}
                </select>
                <button type="button" onClick={()=>{ const n=prompt('輸入新地區名稱，如：韓國'); if(n && store.addCountry(n)) setCountry(n.trim()); }}
                  className="w-10 flex-none rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-500 hover:border-indigo-300 hover:text-indigo-600 transition-all active:scale-90">
                  <Icon name="plus" className="w-4 h-4" />
                </button>
              </div>
            </div>
            <div>
              <label className="block text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">名稱</label>
              <input ref={nameRef} value={name} onChange={e=>setName(e.target.value)} placeholder="例如：敘敘苑 燒肉" required
                className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-[14px] outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 dark:focus:ring-indigo-500/10 transition-all" />
            </div>
          </div>

          <div>
            <label className="block text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">類別</label>
            <div className="grid grid-cols-4 gap-2">
              {CATEGORIES.map(c=>(
                <button type="button" key={c.id} onClick={()=>setCategory(c.id)}
                  className={`flex flex-col items-center gap-1 py-2.5 rounded-xl border-2 text-[11.5px] font-medium transition-all active:scale-95
                  ${category===c.id ? 'border-indigo-500 bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-slate-300'}`}>
                  <span className="text-base leading-none">{c.emoji}</span>{c.label}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="block text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">地址 / 地點關鍵字 或 Google Maps 連結</label>
            <input value={address} onChange={e=>setAddress(e.target.value)} placeholder="例如：東京都台東区 或直接貼上 Google 地圖連結"
              className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-[14px] outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 dark:focus:ring-indigo-500/10 transition-all" />
            {mapsUrl ? (
              <div className="mt-2 flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-[11px] font-mono break-all">
                <Icon name="navigation" className="w-3.5 h-3.5 flex-none" />{mapsUrl}
              </div>
            ) : null}
          </div>

          <div>
            <label className="block text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">備註 / 推薦原因</label>
            <textarea value={note} onChange={e=>setNote(e.target.value)} rows="3" placeholder="想吃的招牌菜、推薦理由… 可加入 #必吃 #需預約 #伴手禮 等標籤"
              className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-[14px] outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 dark:focus:ring-indigo-500/10 transition-all resize-y"></textarea>
          </div>

          <div className="space-y-2">
            <div className="flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
              <span className="text-[13px] font-medium flex items-center gap-2"><Icon name="star" className="w-4 h-4 text-slate-400" /> ⭐ 必回訪 / 下次再買</span>
              <Toggle on={favorite} onClick={()=>setFavorite(v=>!v)} color="amber" />
            </div>
            <div className="flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
              <span className="text-[13px] font-medium flex items-center gap-2"><Icon name="check-circle-2" className="w-4 h-4 text-slate-400" /> 已完成（去過 / 買過）</span>
              <Toggle on={done} onClick={()=>setDone(v=>!v)} />
            </div>
            {!editing ? (
              <div className="flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
                <span className="text-[13px] font-medium flex items-center gap-2"><Icon name="repeat" className="w-4 h-4 text-slate-400" /> 儲存後繼續新增下一筆</span>
                <Toggle on={keepOpen} onClick={()=>setKeepOpen(v=>!v)} />
              </div>
            ) : null}
          </div>

          <div className="flex items-center gap-2 pt-1">
            {editing ? (
              <button type="button" onClick={handleDelete} className="px-4 py-2.5 rounded-xl bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400 text-[13.5px] font-semibold flex items-center gap-1.5 transition-all active:scale-95">
                <Icon name="trash-2" className="w-4 h-4" /> 刪除
              </button>
            ) : null}
            <button type="button" onClick={onClose} className="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[13.5px] font-semibold text-slate-600 dark:text-slate-300 transition-all active:scale-95">取消</button>
            <button type="submit" className="flex-1 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-[13.5px] font-semibold shadow-soft flex items-center justify-center gap-1.5 transition-all active:scale-95">
              <Icon name="check" className="w-4 h-4" /> 儲存
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

                <Icon name="cloud-upload" className="w-3.5 h-3.5" /> 本機→覆蓋雲端
              </button>
              <button onClick={store.downloadOverwriteLocal} className="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[12px] font-semibold flex items-center justify-center gap-1.5 hover:border-slate-300 transition-all active:scale-95">
                <Icon name="cloud-download" className="w-3.5 h-3.5" /> 雲端→覆蓋本機
              </button>
            </div>
          </section>

          <section>
            <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-600 mb-3">外觀主題</h3>
            <div className="grid grid-cols-3 gap-2">
              {[['light','sun','淺色'],['dark','moon','深色'],['system','monitor','系統']].map(([k,icon,label])=>(
                <button key={k} onClick={()=>setTheme(k)}
                  className={`flex flex-col items-center gap-1.5 py-3 rounded-xl border-2 text-[12px] font-medium transition-all active:scale-95
                  ${theme===k ? 'border-indigo-500 bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>
                  <Icon name={icon} className="w-4 h-4" />{label}
                </button>
              ))}
            </div>
          </section>

          <section>
            <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-600 mb-3">地區管理</h3>
            <div className="flex flex-wrap gap-2 mb-2.5">
              {store.countries.map(c=>(
                <span key={c} className="inline-flex items-center gap-1.5 pl-3 pr-1.5 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-[12.5px] font-medium">
                  {COUNTRY_FLAGS[c]||'🏳️'} {c}
                  <button onClick={()=>store.removeCountry(c)} className="w-5 h-5 rounded-full bg-white dark:bg-slate-700 flex items-center justify-center hover:bg-rose-50 hover:text-rose-500 transition-all"><Icon name="x" className="w-3 h-3" /></button>
                </span>
              ))}
            </div>
            <div className="flex gap-2">
              <input value={newCountry} onChange={e=>setNewCountry(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); if(store.addCountry(newCountry)) setNewCountry(''); } }}
                placeholder="輸入新地區，如：韓國" className="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-[13px] outline-none focus:border-indigo-400 transition-all" />
              <button onClick={()=>{ if(store.addCountry(newCountry)) setNewCountry(''); }} className="w-9 flex-none rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-500 hover:border-indigo-300 hover:text-indigo-600 transition-all active:scale-90"><Icon name="plus" className="w-4 h-4" /></button>
            </div>
          </section>

          <section>
            <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-600 mb-3">本機備份（JSON）</h3>
            <div className="flex gap-2">
              <button onClick={store.exportJSON} className="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[12.5px] font-semibold flex items-center justify-center gap-1.5 hover:border-slate-300 transition-all active:scale-95">
                <Icon name="download" className="w-3.5 h-3.5" /> 匯出 JSON
              </button>
              <button onClick={()=>fileRef.current && fileRef.current.click()} className="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[12.5px] font-semibold flex items-center justify-center gap-1.5 hover:border-slate-300 transition-all active:scale-95">
                <Icon name="upload" className="w-3.5 h-3.5" /> 匯入 JSON
              </button>
              <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={e=>{ const f=e.target.files[0]; if(f) store.importJSON(f); e.target.value=''; }} />
            </div>
          </section>

          <section>
            <h3 className="text-[11px] font-bold uppercase tracking-wider text-rose-400 mb-3">危險區域</h3>
            <button onClick={()=>{ if(confirm('確定要清除所有「本機」資料嗎？雲端試算表資料不會被刪除。')) store.clearLocalData(); }}
              className="w-full px-3 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 text-[12.5px] font-semibold transition-all active:scale-95">
              清除所有本機資料
            </button>
          </section>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ============ Stats Modal ============ */
function StatsModal({ open, onClose, store }){
  if(!open) return null;
  const total = store.items.length;
  const done = store.items.filter(i=>i.done).length;
  const fav = store.items.filter(i=>i.favorite).length;
  const maxCat = Math.max(1, ...CATEGORIES.map(c=>store.items.filter(i=>i.category===c.id).length));
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4" onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-soft-md border border-slate-200/70 dark:border-slate-700/60 p-6 anim-in">
        <div className="flex items-center justify-between mb-5">
          <h2 className="text-lg font-bold flex items-center gap-2"><Icon name="bar-chart-3" className="w-5 h-5 text-indigo-500" /> 統計總覽</h2>
          <button onClick={onClose} className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all"><Icon name="x" className="w-4 h-4" /></button>
        </div>
        <div className="grid grid-cols-3 gap-2.5 mb-6">
          <div className="rounded-2xl border border-slate-200 dark:border-slate-700 p-3 text-center"><div className="text-2xl font-bold font-mono text-indigo-600 dark:text-indigo-400">{total}</div><div className="text-[10.5px] text-slate-500 mt-0.5">總項目</div></div>
          <div className="rounded-2xl border border-slate-200 dark:border-slate-700 p-3 text-center"><div className="text-2xl font-bold font-mono text-emerald-600 dark:text-emerald-400">{done}</div><div className="text-[10.5px] text-slate-500 mt-0.5">已完成</div></div>
          <div className="rounded-2xl border border-slate-200 dark:border-slate-700 p-3 text-center"><div className="text-2xl font-bold font-mono text-amber-500">{fav}</div><div className="text-[10.5px] text-slate-500 mt-0.5">必回訪</div></div>
        </div>
        <div className="space-y-2.5">
          {CATEGORIES.map(c=>{
            const n = store.items.filter(i=>i.category===c.id).length;
            return (
              <div key={c.id} className="flex items-center gap-3">
                <span className="w-20 flex-none text-[12px] font-medium text-slate-600 dark:text-slate-300">{c.emoji} {c.label}</span>
                <div className="flex-1 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><div className="h-full bg-indigo-500 rounded-full transition-all duration-500" style={{width:(n/maxCat*100)+'%'}}></div></div>
                <span className="w-6 text-right text-[11px] font-mono text-slate-400">{n}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ============ Toast ============ */
function ToastView({ msg }){
  return (
    <div className={`fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-[90] px-5 py-3 rounded-full bg-slate-900 dark:bg-indigo-600 text-white text-[13px] font-medium shadow-soft-md transition-all duration-300 max-w-[88vw] truncate
      ${msg ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2 pointer-events-none'}`}>
      {msg}
    </div>
  );
}

/* ============ App ============ */
function App(){
  const store = useTripStore();
  const [itemModal, setItemModal] = useState({ open:false, editing:null });
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [statsOpen, setStatsOpen] = useState(false);
  const [effectiveTheme, setEffectiveTheme] = useState('light');
  const mainRef = useRef(null);

  useEffect(()=>{
    function apply(){
      const eff = store.theme==='system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light') : store.theme;
      document.documentElement.classList.toggle('dark', eff==='dark');
      setEffectiveTheme(eff);
    }
    apply();
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = ()=>{ if(store.theme==='system') apply(); };
    mq.addEventListener('change', onChange);
    return ()=>mq.removeEventListener('change', onChange);
  }, [store.theme]);

  useEffect(()=>{
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
    }
  }, []);

  const filtered = useMemo(()=>{
    const f = store.filters;
    return store.items.filter(it=>{
      if(f.country!=='all' && it.country!==f.country) return false;
      if(f.category!=='all' && it.category!==f.category) return false;
      if(f.status==='todo' && it.done) return false;
      if(f.status==='done' && !it.done) return false;
      if(f.status==='fav' && !it.favorite) return false;
      if(f.search){
        const s = f.search.toLowerCase();
        const hay = [it.name, it.note, it.country, it.address, CAT_MAP[it.category]?CAT_MAP[it.category].label:''].join(' ').toLowerCase();
        if(hay.indexOf(s)===-1) return false;
      }
      return true;
    }).sort((a,b)=>{
      if(a.done !== b.done) return a.done ? 1 : -1;
      if(a.favorite !== b.favorite) return a.favorite ? -1 : 1;
      return (b.updatedAt||b.createdAt) - (a.updatedAt||a.createdAt);
    });
  }, [store.items, store.filters]);

  const openAdd = ()=>setItemModal({ open:true, editing:null });
  const openEdit = (item)=>setItemModal({ open:true, editing:item });
  const closeModal = ()=>setItemModal({ open:false, editing:null });
  const clearFilters = ()=>store.setFilters({ country:'all', category:'all', status:'all', search:'' });

  const showSkeleton = store.gasUrl && store.syncing && !store.hasLoadedOnce;

  return (
    <div className="min-h-screen">
      <Sidebar store={store} onOpenAdd={openAdd} onOpenSettings={()=>setSettingsOpen(true)} />

      <div className="md:pl-72">
        {(!store.online && store.gasUrl) ? (
          <div className="bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-400 text-[12px] font-medium px-4 md:px-8 py-2 flex items-center gap-2">
            <Icon name="wifi-off" className="w-3.5 h-3.5" /> 目前離線，變更會先存在本機，恢復連線後自動同步
          </div>
        ) : null}
        {(!store.gasUrl) ? (
          <div className="bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-400 text-[12px] font-medium px-4 md:px-8 py-2 flex items-center gap-2">
            <Icon name="cloud-off" className="w-3.5 h-3.5" /> 尚未設定雲端同步網址，點右上角設定圖示開始設定
          </div>
        ) : null}

        <TopBar store={store} effectiveTheme={effectiveTheme}
          onToggleTheme={()=>store.setTheme(effectiveTheme==='dark'?'light':'dark')}
          onOpenSettings={()=>setSettingsOpen(true)} onOpenStats={()=>setStatsOpen(true)} />

        <main ref={mainRef} className="px-4 md:px-8 py-5 pb-28">
          {showSkeleton ? (
            <div className="columns-1 sm:columns-2 xl:columns-3 gap-4">
              {[0,1,2,3,4].map(i=><SkeletonCard key={i} />)}
            </div>
          ) : store.items.length===0 ? (
            <EmptyAll onAdd={openAdd} onImportSample={store.importSampleData} />
          ) : filtered.length===0 ? (
            <EmptyFiltered onClear={clearFilters} />
          ) : (
            <div className="columns-1 sm:columns-2 xl:columns-3 gap-4">
              {filtered.map(item=>(
                <Card key={item.id} item={item} pending={store.pendingIds.has(item.id)}
                  onToggleDone={store.toggleDone} onToggleFav={store.toggleFav}
                  onEdit={openEdit} onDelete={(id)=>{ if(confirm('確定要刪除這個項目嗎？')) store.deleteItem(id); }} />
              ))}
            </div>
          )}
        </main>
      </div>

      <button onClick={openAdd} title="新增項目"
        className="md:hidden fixed right-5 bottom-7 w-14 h-14 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-soft-md flex items-center justify-center z-40 transition-all active:scale-90">
        <Icon name="plus" className="w-6 h-6" strokeWidth={2.2} />
      </button>

      <ItemModal open={itemModal.open} editing={itemModal.editing} onClose={closeModal} store={store} />
      <SettingsDrawer open={settingsOpen} onClose={()=>setSettingsOpen(false)} store={store} theme={store.theme} setTheme={store.setTheme} />
      <StatsModal open={statsOpen} onClose={()=>setStatsOpen(false)} store={store} />
      <ToastView msg={store.toast} />
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
