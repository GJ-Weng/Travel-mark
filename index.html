    camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.2"/>',

  function icon(name, cls, opts){
    opts = opts || {};
    var sw = opts.strokeWidth || 2;
    var fill = opts.filled ? 'currentColor' : 'none';
    var content = ICONS[name] || ICONS.circle;
    return '<svg viewBox="0 0 24 24" class="' + (cls||'w-4 h-4') + '" fill="' + fill + '" stroke="currentColor" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round">' + content + '</svg>';
  }

  /* ============ Constants ============ */

  var K_COUNTRIES = "tt2_countries_v1";

  var K_FILTERS = "tt2_filters_v4";
  var K_GAS = "tt2_gas_url_v1";
  var K_QUEUE = "tt2_sync_queue_v1";
  var K_LASTSYNC = "tt2_last_sync_v1";
  var K_PHOTOS = "tt2_photos_v1"; // local-only, never synced to Google Sheets

  var CATEGORIES = [

  var COUNTRY_FLAGS = {
    "台灣":"🇹🇼","日本":"🇯🇵","美國":"🇺🇸","韓國":"🇰🇷","泰國":"🇹🇭","法國":"🇫🇷","英國":"🇬🇧","義大利":"🇮🇹",

    "馬來西亞":"🇲🇾","印尼":"🇮🇩","菲律賓":"🇵🇭","印度":"🇮🇳","荷蘭":"🇳🇱","瑞士":"🇨🇭","紐西蘭":"🇳🇿","土耳其":"🇹🇷","杜拜":"🇦🇪"
  };

  var SYNC_DEBOUNCE_MS = 700, RETRY_BASE_MS = 4000, FETCH_TIMEOUT_MS = 15000;
  var MAX_PHOTOS = 3, PHOTO_MAX_DIM = 720, PHOTO_QUALITY = 0.7;

  var SAMPLE_ITEMS = [
    { country:"日本", category:"restaurant", name:"叙叙苑 燒肉 銀座店", address:"東京都中央区銀座", note:"招牌牛舌跟和牛拼盤必點，價位偏高但很值得", tags:["燒肉","必吃","需預約"], favorite:true, done:false },
    { country:"日本", category:"spot", name:"八坂神社", address:"京都府京都市東山区祇園町", note:"祇園附近散步順遊，晚上點燈很漂亮，跟清水寺可以排同一天", tags:["神社","必去"], favorite:false, done:false },
    { country:"日本", category:"shopping", name:"大國藥妝 道頓堀店", address:"大阪府大阪市中央区道頓堀", note:"面膜跟胃藥都比較便宜，記得比價", tags:["伴手禮","藥妝"], favorite:false, done:true, checkInDate:"2026-03-12", visitNote:"買了一堆眼藥水跟蒸氣眼罩，比市價便宜快三成，隊友都說好用。" },

  /* ============ State ============ */
  var state = {

  /* ============ Storage ============ */
  function loadJSON(key, fallback){ try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
  function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
  function uid(){ return 'it_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }

  function buildSeedItems(){
    var now = Date.now();
    return SAMPLE_ITEMS.map(function(s, i){
      var o = { id: uid(), createdAt: now - (SAMPLE_ITEMS.length - i) * 3600000, updatedAt: now - (SAMPLE_ITEMS.length - i) * 3600000, tags: [], checkInDate:"", visitNote:"" };
      for(var k in s) o[k] = s[k];
      return o;
    });
  }
  function loadItemsWithSeed(){
    var raw = localStorage.getItem(K_ITEMS);
    if(raw === null) return buildSeedItems();
    try{
      var parsed = JSON.parse(raw);
      if(!Array.isArray(parsed)) return buildSeedItems();
      parsed.forEach(function(it){
        if(!Array.isArray(it.tags)) it.tags = [];
        if(it.checkInDate == null) it.checkInDate = '';
        if(it.visitNote == null) it.visitNote = '';
      });
      return parsed;
    }catch(e){ return buildSeedItems(); }
  }

  function loadState(){
    state.items = loadItemsWithSeed();
    state.countries = loadJSON(K_COUNTRIES, DEFAULT_COUNTRIES.slice());
    state.theme = loadJSON(K_THEME, "system");
    var savedFilters = loadJSON(K_FILTERS, null);

    state.gasUrl = localStorage.getItem(K_GAS) || "";
    state.queue = loadJSON(K_QUEUE, []);
    state.lastSyncAt = Number(localStorage.getItem(K_LASTSYNC)) || 0;
    state.hasLoadedOnce = state.items.length > 0;
    rebuildPendingIds();
  }
  function persistItems(){ persistItemsResult = saveJSON(K_ITEMS, state.items); if(!persistItemsResult) showToast('本機儲存空間不足，部分變更可能未保存'); }
  var persistItemsResult = true;
  function persistCountries(){ saveJSON(K_COUNTRIES, state.countries); }
  function persistTheme(){ saveJSON(K_THEME, state.theme); }
  function persistFilters(){ saveJSON(K_FILTERS, state.filters); }
  function persistGasUrl(){ localStorage.setItem(K_GAS, state.gasUrl || ""); }
  function persistQueue(){ saveJSON(K_QUEUE, state.queue); rebuildPendingIds(); }
  function persistLastSync(){ localStorage.setItem(K_LASTSYNC, String(state.lastSyncAt)); }
  function rebuildPendingIds(){
    pendingIds = {};
    state.queue.forEach(function(a){
      if(a.type === 'upsert-item' && a.payload) pendingIds[a.payload.id] = true;
      if(a.type === 'delete-item') pendingIds[a.id] = true;
    });
  }

  /* ---- local photo store (never synced) ---- */
  function loadPhotosMap(){ return loadJSON(K_PHOTOS, {}); }
  function savePhotosForItem(id, photos){

  }
  function getPhotosForItem(id, map){ map = map || loadPhotosMap(); return map[id] || []; }
  function deletePhotosForItem(id){ var map = loadPhotosMap(); delete map[id]; saveJSON(K_PHOTOS, map); }

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, cw, ch);
          try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
          catch(err){ reject(err); }
        };
        img.onerror = function(){ reject(new Error('image decode failed')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('file read failed')); };
      reader.readAsDataURL(file);
    });
  }

  /* ============ Helpers ============ */
  function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function isDirectMapsLink(v){ return /^https?:\/\//i.test((v||"").trim()); }
  function buildMapsUrl(name, addressOrLink){
    var a = (addressOrLink||"").trim();
    if(isDirectMapsLink(a)) return a;
    var q = [name||"", a].filter(Boolean).join(" ").trim();
    if(!q) return "";
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  }
  function formatDate(ts){
    if(!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + "." + pad2(d.getMonth()+1) + "." + pad2(d.getDate());
  }
  function formatDateStr(s){
    if(!s) return '';
    var parts = String(s).split('-');
    if(parts.length!==3) return s;
    return parts[0] + '.' + parts[1] + '.' + parts[2];
  }
  function timeAgo(ts){
    if(!ts) return '尚未同步';
    var diff = Math.max(0, Date.now() - ts);
    var m = Math.floor(diff/60000);
    if(m < 1) return '剛剛同步';
    if(m < 60) return m + ' 分鐘前';
    var h = Math.floor(m/60);
    if(h < 24) return h + ' 小時前';
    return Math.floor(h/24) + ' 天前';
  }
  function fetchWithTimeout(url, opts){
    opts = opts || {};
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, FETCH_TIMEOUT_MS);
    opts.signal = controller.signal;
    return fetch(url, opts).finally(function(){ clearTimeout(timer); });
  }
  function showToast(msg){
    var el = document.getElementById('toastRoot');
    el.innerHTML = '<div class="fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-[90] px-5 py-3 rounded-full bg-slate-900 dark:bg-indigo-600 text-white text-[13px] font-medium shadow-soft-md max-w-[88vw] truncate anim-in">' + esc(msg) + '</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.innerHTML = ''; }, 2600);
  }

  /* ============ Sync engine ============ */
  function syncStatusText(){
    if(!state.gasUrl) return '尚未設定同步';
    if(state.syncing) return '同步中…';
    if(!state.online) return '離線 · ' + state.queue.length + ' 筆待同步';
    if(state.queue.length>0) return state.queue.length + ' 筆待同步';
    return timeAgo(state.lastSyncAt) + '同步';
  }
  function syncDotClass(){
    if(!state.gasUrl) return 'bg-slate-300 dark:bg-slate-600';
    if(state.syncing || !state.online || state.queue.length>0) return 'bg-amber-500 pulse-dot';
    return 'bg-emerald-500';
  }
  function applyServerState(data){
    if(Array.isArray(data.items)){
      data.items.forEach(function(it){
        if(!Array.isArray(it.tags)) it.tags = [];
        if(it.checkInDate == null) it.checkInDate = '';
        if(it.visitNote == null) it.visitNote = '';
      });
      state.items = data.items;
    }
    if(Array.isArray(data.countries) && data.countries.length) state.countries = data.countries;
    persistItems(); persistCountries();
    state.lastSyncAt = Date.now(); persistLastSync();
    state.hasLoadedOnce = true;
  }
  function queueAction(action){
    action.clientId = uid(); action.ts = Date.now();
    state.queue.push(action); persistQueue();
    scheduleSync();
  }
  function scheduleSync(){
    if(!state.gasUrl) return;
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(flushQueue, SYNC_DEBOUNCE_MS);
  }
  function doPlainRefresh(){
    if(!state.gasUrl || !state.online) return;
    state.syncing = true; render();
    fetchWithTimeout(state.gasUrl + '?action=list', { method:'GET' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(!data || data.success === false) throw new Error((data && data.error) || '讀取失敗');
        applyServerState(data); state.syncing = false; render();
        showToast('已是最新資料 ✓');
      })
      .catch(function(){ state.syncing = false; render(); showToast('連線失敗，稍後再試'); });
  }
  function scheduleRetry(){
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function(){
      retryDelay = Math.min(retryDelay * 1.6, 60000);
      flushQueue();
    }, retryDelay);
  }
  function flushQueue(){
    if(!state.gasUrl || !state.online || state.syncing){ return; }
    if(state.queue.length === 0){ return doPlainRefresh(); }
    state.syncing = true; render();
    var batch = state.queue.slice();
    fetchWithTimeout(state.gasUrl, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ actions: batch })
    }).then(function(res){ return res.json(); })
      .then(function(data){
        if(!data || data.success === false) throw new Error((data && data.error) || '同步失敗');
        var sentIds = {}; batch.forEach(function(a){ sentIds[a.clientId] = true; });
        state.queue = state.queue.filter(function(a){ return !sentIds[a.clientId]; });
        persistQueue();
        applyServerState(data);
        retryDelay = RETRY_BASE_MS;
        state.syncing = false; render();
        showToast('已同步至雲端 ✓');
        if(state.queue.length > 0) scheduleSync();
      })
      .catch(function(){ state.syncing = false; render(); showToast('同步失敗，將自動重試'); scheduleRetry(); });
  }
  function manualSync(){
    if(!state.gasUrl){ openSettings(); showToast('請先設定同步網址'); return; }
    if(!state.online){ showToast('目前離線，連線後會自動同步'); return; }
    clearTimeout(syncDebounceTimer);
    flushQueue();
  }
  function testConnection(url, btnEl){
    if(!url){ showToast('請先輸入網址'); return; }
    if(btnEl) btnEl.disabled = true;
    fetchWithTimeout(url + '?action=ping', { method:'GET' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data && data.pong) showToast('連線成功 ✓');
        else showToast('連線異常，請確認網址與部署設定');
      })
      .catch(function(){ showToast('連線失敗，請確認網址與部署權限'); })
      .finally(function(){ if(btnEl) btnEl.disabled = false; });
  }
  function saveGasUrlAndSync(url){
    state.gasUrl = url; persistGasUrl(); render();
    if(url){ showToast('已儲存，開始同步…'); setTimeout(flushQueue, 100); }
    else showToast('已清除同步網址');
  }
  function uploadOverwriteCloud(){
    if(!state.gasUrl){ showToast('請先設定同步網址'); return; }
    if(!confirm('這會用「本機資料」完全覆蓋雲端試算表內容，確定嗎？（照片只存在本機，不會上傳）')) return;
    state.syncing = true; render();
    fetchWithTimeout(state.gasUrl, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ actions:[{ type:'replace-all', clientId:uid(), items: state.items, countries: state.countries }] })
    }).then(function(res){ return res.json(); })
      .then(function(data){
        if(!data || data.success===false) throw new Error('失敗');
        state.queue = []; persistQueue(); applyServerState(data);
        state.syncing = false; render(); showToast('已上傳並覆蓋雲端資料 ✓');
      }).catch(function(){ state.syncing=false; render(); showToast('上傳失敗，請檢查連線'); });
  }
  function downloadOverwriteLocal(){
    if(!state.gasUrl){ showToast('請先設定同步網址'); return; }
    if(!confirm('這會用「雲端資料」完全覆蓋本機內容，確定嗎？（本機照片不受影響）')) return;
    state.syncing = true; render();
    fetchWithTimeout(state.gasUrl + '?action=list', { method:'GET' })
      .then(function(res){ return res.json(); })

        state.queue = []; persistQueue(); applyServerState(data);
        state.syncing = false; render(); showToast('已用雲端資料覆蓋本機 ✓');
      }).catch(function(){ state.syncing=false; render(); showToast('下載失敗，請檢查連線'); });

  /* ============ CRUD ============ */
  function addItem(data){
    var now = Date.now();
    var newItem = { id: uid(), createdAt: now, updatedAt: now, done:false, favorite:false, tags:[], checkInDate:'', visitNote:'' };
    for(var k in data) newItem[k] = data[k];
    state.items.push(newItem); persistItems();
    queueAction({ type:'upsert-item', payload:newItem });
    return newItem;
  }
  function updateItem(id, patch){
    var idx = state.items.findIndex(function(it){ return it.id===id; });
    if(idx===-1) return;
    var updated = {}; for(var k in state.items[idx]) updated[k]=state.items[idx][k];
    for(var k2 in patch) updated[k2]=patch[k2];
    updated.updatedAt = Date.now();
    state.items[idx] = updated; persistItems();
    queueAction({ type:'upsert-item', payload: updated });
  }
  function toggleDone(id){
    var it = state.items.find(function(x){ return x.id===id; }); if(!it) return;
    var newDone = !it.done;
    it.done = newDone;
    if(newDone && !it.checkInDate) it.checkInDate = todayStr();
    it.updatedAt = Date.now(); persistItems();
    queueAction({ type:'upsert-item', payload: it }); render();
  }
  function toggleFav(id){
    var it = state.items.find(function(x){ return x.id===id; }); if(!it) return;
    it.favorite = !it.favorite; it.updatedAt = Date.now(); persistItems();
    queueAction({ type:'upsert-item', payload: it }); render();
  }
  function deleteItemLocal(id){
    state.items = state.items.filter(function(it){ return it.id !== id; }); persistItems();
    deletePhotosForItem(id);
    queueAction({ type:'delete-item', id: id });
  }
  function importSampleData(){
    SAMPLE_ITEMS.forEach(function(s){ addItem(s); });
    if(state.countries.indexOf('台灣')===-1) state.countries.push('台灣');
    persistCountries();
    showToast('已匯入範例資料 ✨'); render();
  }
  function addCountry(name){
    name = (name||'').trim();
    if(!name) return false;
    if(state.countries.indexOf(name) > -1){ showToast('這個地區已經存在'); return false; }
    state.countries.push(name); persistCountries();
    queueAction({ type:'upsert-country', name: name });
    return true;
  }
  function removeCountry(name){
    var used = state.items.some(function(it){ return it.country === name; });
    if(used && !confirm('「'+name+'」目前有項目在使用，仍要刪除嗎？（項目本身不會被刪除）')) return;
    state.countries = state.countries.filter(function(c){ return c !== name; }); persistCountries();
    queueAction({ type:'delete-country', name: name });
    if(state.filters.country === name){ state.filters.country = 'all'; persistFilters(); }
    render();
  }
  function exportJSON(){
    var payload = { app:"trip-tags", version:3, exportedAt:new Date().toISOString(), countries: state.countries, items: state.items };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'trip-tags-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('已匯出 JSON 檔案（照片存在本機，不含在匯出檔內）');
  }
  function importJSONFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.items)) throw new Error('格式不正確');
        data.items.forEach(function(it){ if(!Array.isArray(it.tags)) it.tags=[]; if(it.checkInDate==null) it.checkInDate=''; if(it.visitNote==null) it.visitNote=''; });
        var replace = confirm('偵測到 '+data.items.length+' 筆項目。\n按「確定」= 合併到現有資料\n按「取消」= 取代所有現有資料');
        if(replace){
          state.items = data.items;
          state.countries = Array.isArray(data.countries) && data.countries.length ? data.countries : DEFAULT_COUNTRIES.slice();
          state.items.forEach(function(it){ queueAction({ type:'upsert-item', payload: it }); });
        } else {
          var existingIds = {}; state.items.forEach(function(it){ existingIds[it.id]=true; });
          data.items.forEach(function(it){
            var clean = existingIds[it.id] ? Object.assign({}, it, { id: uid() }) : it;
            state.items.push(clean);
            queueAction({ type:'upsert-item', payload: clean });
          });
          (data.countries||[]).forEach(function(c){ if(state.countries.indexOf(c)===-1){ state.countries.push(c); queueAction({type:'upsert-country', name:c}); } });
        }
        persistItems(); persistCountries();
        showToast('匯入完成，正在同步至雲端…'); render();
      }catch(e){ showToast('匯入失敗：檔案格式不正確'); }
    };
    reader.readAsText(file);
  }
  function clearLocalData(){
    state.items = []; state.countries = DEFAULT_COUNTRIES.slice(); state.queue = [];
    persistItems(); persistCountries(); persistQueue();
    saveJSON(K_PHOTOS, {});
    showToast('已清除本機資料（含照片）'); render();
  }

  /* ============ Theme ============ */
  function effectiveTheme(){
    return state.theme==='system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light') : state.theme;
  }
  function applyTheme(){
    document.documentElement.classList.toggle('dark', effectiveTheme()==='dark');
  }

  /* ============ Tags ============ */
  function getPopularTags(limit){
    var counts = {};
    state.items.forEach(function(it){ (it.tags||[]).forEach(function(t){ counts[t] = (counts[t]||0) + 1; }); });
    return Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0, limit).map(function(t){ return { tag:t, count:counts[t] }; });
  }

  /* ============ Filtering ============ */
  function getFiltered(){
    var f = state.filters;
    return state.items.filter(function(it){
      if(f.country!=='all' && it.country!==f.country) return false;
      if(f.category!=='all' && it.category!==f.category) return false;
      if(f.status==='todo' && it.done) return false;
      if(f.status==='done' && !it.done) return false;
      if(f.status==='fav' && !it.favorite) return false;
      if(f.tag && f.tag!=='all' && (it.tags||[]).indexOf(f.tag)===-1) return false;
      if(f.search){
        var s = f.search.toLowerCase();
        var hay = [it.name, it.note, it.country, it.address, it.visitNote, (it.tags||[]).join(' '), CAT_MAP[it.category]?CAT_MAP[it.category].label:''].join(' ').toLowerCase();
        if(hay.indexOf(s)===-1) return false;
      }
      return true;
    }).sort(function(a,b){
      if(a.done !== b.done) return a.done ? 1 : -1;
      if(a.favorite !== b.favorite) return a.favorite ? -1 : 1;
      return (b.updatedAt||b.createdAt) - (a.updatedAt||a.createdAt);
    });
  }

  function renderTopBar(){
    var f = state.filters;
    var statusTabs = [['all','全部'],['todo','未去/未買'],['done','已去/已買'],['fav','⭐ 必回訪']].map(function(t){

  function renderList(){
    var wrap = document.getElementById('listWrap');
    var showSkeleton = state.gasUrl && state.syncing && !state.hasLoadedOnce;
    if(showSkeleton){
      wrap.innerHTML = '<div class="columns-1 sm:columns-2 xl:columns-3 gap-4">'+skeletonCard()+skeletonCard()+skeletonCard()+skeletonCard()+skeletonCard()+'</div>';
      return;
    }
    if(state.items.length===0){ wrap.innerHTML = emptyAllHtml(); return; }
    var filtered = getFiltered();
    if(filtered.length===0){ wrap.innerHTML = emptyFilteredHtml(); return; }
    var photosMap = loadPhotosMap();
    wrap.innerHTML = '<div class="columns-1 sm:columns-2 xl:columns-3 gap-4">'+filtered.map(function(it){ return cardHtml(it, photosMap); }).join('')+'</div>';

  /* ============ Render: Lightbox ============ */
  function renderLightbox(){
    var root = document.getElementById('lightboxRoot');
    if(!state.lightbox){ root.innerHTML=''; return; }
    var photosMap = loadPhotosMap();
    var photos = getPhotosForItem(state.lightbox.id, photosMap);
    if(!photos.length){ state.lightbox=null; root.innerHTML=''; return; }
    var idx = ((state.lightbox.index % photos.length) + photos.length) % photos.length;
    var item = state.items.find(function(it){ return it.id===state.lightbox.id; });
    root.innerHTML =
      '<div id="lightboxOverlay" class="fixed inset-0 z-[95] bg-black/85 flex items-center justify-center p-4 anim-in">'+
        '<button data-action="close-lightbox" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all active:scale-90">'+icon('x','w-5 h-5')+'</button>'+
        (item ? '<div class="absolute top-4 left-4 text-white/80 text-[13px] font-medium">'+esc(item.name)+' · '+(idx+1)+'/'+photos.length+'</div>' : '')+
        (photos.length>1 ? '<button data-action="lightbox-prev" class="absolute left-3 md:left-6 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all active:scale-90">'+icon('chevron-left','w-6 h-6')+'</button>' : '')+
        '<img src="'+photos[idx]+'" class="max-w-full max-h-[85vh] rounded-xl object-contain shadow-soft-md">'+
        (photos.length>1 ? '<button data-action="lightbox-next" class="absolute right-3 md:right-6 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all active:scale-90">'+icon('chevron-right','w-6 h-6')+'</button>' : '')+
      '</div>';
    document.getElementById('lightboxOverlay').addEventListener('click', function(e){ if(e.target===this) closeLightbox(); });
  }
  function openLightbox(id, index){ state.lightbox = { id:id, index:index }; renderLightbox(); }
  function closeLightbox(){ state.lightbox = null; renderLightbox(); }
  function lightboxNav(delta){ if(!state.lightbox) return; state.lightbox.index += delta; renderLightbox(); }

  /* ============ Render: Item Modal ============ */
  function renderTagChipsHtml(){
    return state.formTags.map(function(t, idx){
      return '<span class="inline-flex items-center gap-1 pl-2.5 pr-1.5 py-1 rounded-full bg-violet-50 text-violet-700 dark:bg-violet-500/10 dark:text-violet-300 text-[11.5px] font-medium">#'+esc(t)+

    }).join('');

  function wireTagChipRemovers(){
    var container = document.getElementById('tagChipsContainer');
    if(!container) return;
    container.querySelectorAll('[data-tag-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(this.getAttribute('data-tag-remove'), 10);
        state.formTags.splice(idx, 1);
        container.innerHTML = renderTagChipsHtml();
        wireTagChipRemovers();
      });
    });
  }
  function commitTagInput(){
    var input = document.getElementById('tagInput');
    if(!input) return;
    var parts = input.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    parts.forEach(function(p){ if(state.formTags.indexOf(p)===-1) state.formTags.push(p); });
    input.value = '';
    var container = document.getElementById('tagChipsContainer');
    container.innerHTML = renderTagChipsHtml();
    wireTagChipRemovers();
    input.focus();
  }

  function wireCheckinSection(){
    var dateInput = document.getElementById('checkInDateInput');
    if(dateInput) dateInput.addEventListener('input', function(){ state.formCheckInDate = this.value; });

    if(noteInput) noteInput.addEventListener('input', function(){ state.formVisitNote = this.value; });
    wirePhotoRemovers();

    if(photoInput){
      photoInput.addEventListener('change', function(e){
        var files = Array.prototype.slice.call(e.target.files || []);
        var remaining = MAX_PHOTOS - state.modalPhotos.length;
        files = files.slice(0, Math.max(0, remaining));
        if(files.length===0){ e.target.value=''; return; }
        Promise.all(files.map(function(f){ return compressImage(f, PHOTO_MAX_DIM, PHOTO_QUALITY); }))
          .then(function(results){ results.forEach(function(b64){ state.modalPhotos.push(b64); }); refreshPhotoGrid(); })
          .catch(function(){ showToast('照片處理失敗，請換一張試試'); })
          .finally(function(){ e.target.value=''; });
      });
    }
  }

            '<button id="addCountryBtn" class="w-9 flex-none rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-500 hover:border-indigo-300 hover:text-indigo-600 transition-all active:scale-90">'+icon('plus','w-4 h-4')+'</button></div>'+
          '</section>'+
          '<section><h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-600 mb-3">本機備份（JSON）</h3>'+
            '<div class="flex gap-2"><button data-action="export-json" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[12.5px] font-semibold flex items-center justify-center gap-1.5 hover:border-slate-300 transition-all active:scale-95">'+icon('download','w-3.5 h-3.5')+' 匯出 JSON</button>'+
            '<button id="importJsonBtn" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[12.5px] font-semibold flex items-center justify-center gap-1.5 hover:border-slate-300 transition-all active:scale-95">'+icon('upload','w-3.5 h-3.5')+' 匯入 JSON</button>'+
            '<input id="importFileInput" type="file" accept="application/json" class="hidden"></div>'+
          '</section>'+
          '<section><h3 class="text-[11px] font-bold uppercase tracking-wider text-rose-400 mb-3">危險區域</h3>'+
            '<button data-action="clear-local" class="w-full px-3 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 text-[12.5px] font-semibold transition-all active:scale-95">清除所有本機資料（含照片）</button></section>'+
        '</div>'+
      '</div>';

    document.getElementById('settingsOverlay').addEventListener('click', closeSettings);
    document.getElementById('testConnBtn').addEventListener('click', function(){ testConnection(document.getElementById('gasUrlInput').value.trim(), this); });
    document.getElementById('saveGasUrlBtn').addEventListener('click', function(){ saveGasUrlAndSync(document.getElementById('gasUrlInput').value.trim()); renderSettings(); });
    document.getElementById('addCountryBtn').addEventListener('click', function(){
      var input = document.getElementById('newCountryInput');
      if(addCountry(input.value)){ input.value=''; renderSettings(); renderSidebar(); renderTopBar(); }
    });
    document.getElementById('newCountryInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('addCountryBtn').click(); } });
    document.getElementById('importJsonBtn').addEventListener('click', function(){ document.getElementById('importFileInput').click(); });
    document.getElementById('importFileInput').addEventListener('change', function(e){ var f=e.target.files[0]; if(f) importJSONFile(f); e.target.value=''; });
    document.querySelectorAll('[data-theme-choice]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.theme = this.getAttribute('data-theme-choice'); persistTheme(); render(); renderSettings();
      });
    });
  }
  function openSettings(){ state.settingsOpen = true; renderSettings(); }
  function closeSettings(){ state.settingsOpen = false; renderSettings(); }

  /* ============ Render: Stats Modal ============ */
  function renderStats(){
    var root = document.getElementById('statsRoot');
    if(!state.statsOpen){ root.innerHTML=''; return; }
    var total = state.items.length, done = state.items.filter(function(i){return i.done;}).length, fav = state.items.filter(function(i){return i.favorite;}).length;
    var maxCat = Math.max.apply(null, [1].concat(CATEGORIES.map(function(c){ return state.items.filter(function(i){return i.category===c.id;}).length; })));
    var bars = CATEGORIES.map(function(c){
      var n = state.items.filter(function(i){return i.category===c.id;}).length;
      return '<div class="flex items-center gap-3"><span class="w-20 flex-none text-[12px] font-medium text-slate-600 dark:text-slate-300">'+c.emoji+' '+c.label+'</span>'+
        '<div class="flex-1 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><div class="h-full bg-indigo-500 rounded-full transition-all duration-500" style="width:'+(n/maxCat*100)+'%"></div></div>'+
        '<span class="w-6 text-right text-[11px] font-mono text-slate-400">'+n+'</span></div>';
    }).join('');
    var topTags = getPopularTags(6);
    var tagsHtml = topTags.length ? '<div class="flex flex-wrap gap-1.5 mt-4">'+topTags.map(function(t){
      return '<span class="text-[10.5px] px-2 py-0.5 rounded-full bg-violet-50 text-violet-700 dark:bg-violet-500/10 dark:text-violet-300 font-medium">#'+esc(t.tag)+' · '+t.count+'</span>';
    }).join('')+'</div>' : '';
    root.innerHTML =
      '<div id="statsOverlay" class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">'+
        '<div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-soft-md border border-slate-200/70 dark:border-slate-700/60 p-6 anim-in" id="statsBox">'+
          '<div class="flex items-center justify-between mb-5"><h2 class="text-lg font-bold flex items-center gap-2 text-indigo-500">'+icon('bar-chart-3','w-5 h-5')+'<span class="text-slate-900 dark:text-slate-100">統計總覽</span></h2>'+
            '<button data-action="close-stats" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all">'+icon('x','w-4 h-4')+'</button></div>'+
          '<div class="grid grid-cols-3 gap-2.5 mb-6">'+
            '<div class="rounded-2xl border border-slate-200 dark:border-slate-700 p-3 text-center"><div class="text-2xl font-bold font-mono text-indigo-600 dark:text-indigo-400">'+total+'</div><div class="text-[10.5px] text-slate-500 mt-0.5">總項目</div></div>'+
            '<div class="rounded-2xl border border-slate-200 dark:border-slate-700 p-3 text-center"><div class="text-2xl font-bold font-mono text-emerald-600 dark:text-emerald-400">'+done+'</div><div class="text-[10.5px] text-slate-500 mt-0.5">已完成</div></div>'+
            '<div class="rounded-2xl border border-slate-200 dark:border-slate-700 p-3 text-center"><div class="text-2xl font-bold font-mono text-amber-500">'+fav+'</div><div class="text-[10.5px] text-slate-500 mt-0.5">必回訪</div></div>'+
          '</div><div class="space-y-2.5">'+bars+'</div>'+tagsHtml+
        '</div>'+
      '</div>';
    document.getElementById('statsOverlay').addEventListener('click', function(e){ if(e.target===this) closeStats(); });
  }
  function closeStats(){ state.statsOpen=false; renderStats(); }

  /* ============ Master render ============ */
  function render(){
    applyTheme();
    renderBanners();
    renderSidebar();
    renderTopBar();
    renderList();
    document.getElementById('fabAdd').innerHTML = icon('plus','w-6 h-6',{strokeWidth:2.2});
  }

  /* ============ Event delegation (bound once) ============ */
  function handleAction(action){
    if(action==='open-add') return openAddModal();
    if(action==='open-settings') return openSettings();
    if(action==='close-settings') return closeSettings();
    if(action==='open-stats') return (state.statsOpen=true, renderStats());
    if(action==='close-stats') return closeStats();
    if(action==='close-modal') return closeItemModal();
    if(action==='manual-sync') return manualSync();
    if(action==='toggle-theme'){ state.theme = effectiveTheme()==='dark'?'light':'dark'; persistTheme(); render(); return; }
    if(action==='clear-search'){ state.filters.search=''; persistFilters(); renderTopBar(); renderList(); return; }
    if(action==='clear-filters'){ state.filters={country:'all',category:'all',status:'all',search:'',tag:'all'}; persistFilters(); render(); return; }
    if(action==='import-sample') return importSampleData();
    if(action==='export-json') return exportJSON();
    if(action==='upload-overwrite') return uploadOverwriteCloud();
    if(action==='download-overwrite') return downloadOverwriteLocal();
    if(action==='clear-local'){ if(confirm('確定要清除所有「本機」資料嗎？雲端試算表資料不會被刪除，但本機照片會一併清除。')) clearLocalData(); return; }
    if(action==='delete-current'){
      if(state.editingId && confirm('確定要刪除這個項目嗎？此動作無法復原，且會從雲端同步刪除，本機照片也會一併清除。')){
        var id = state.editingId; closeItemModal(); deleteItemLocal(id); showToast('已刪除，同步中…'); render();
      }
      return;
    }
    if(action==='close-lightbox') return closeLightbox();
    if(action==='lightbox-prev') return lightboxNav(-1);
    if(action==='lightbox-next') return lightboxNav(1);
    var parts = action.split(':');
    var key = parts[0], val = parts.slice(1).join(':');
    if(key==='filter-country'){ state.filters.country=val; persistFilters(); render(); return; }
    if(key==='filter-category'){ state.filters.category=val; persistFilters(); render(); return; }
    if(key==='filter-status'){ state.filters.status=val; persistFilters(); render(); return; }
    if(key==='filter-tag'){ state.filters.tag = (state.filters.tag===val) ? 'all' : val; persistFilters(); render(); return; }
    if(key==='open-edit') return openEditModal(val);
    if(key==='toggle-done') return toggleDone(val);
    if(key==='toggle-fav') return toggleFav(val);
    if(key==='delete-item'){ if(confirm('確定要刪除這個項目嗎？')){ deleteItemLocal(val); render(); } return; }
    if(key==='remove-country'){ removeCountry(val); renderSettings(); return; }
    if(key==='open-lightbox'){
      var itemId = parts[1], idx = parseInt(parts[2],10) || 0;
      return openLightbox(itemId, idx);
    }
  }

  function wireGlobalEvents(){
    document.body.addEventListener('click', function(e){
      var el = e.target.closest('[data-action]');
      if(!el) return;
      if(el.getAttribute('data-stop')) e.stopPropagation();
      handleAction(el.getAttribute('data-action'));
    });

    document.getElementById('sidebar').addEventListener('submit', function(e){
      if(e.target.id !== 'quickAddForm') return;
      e.preventDefault();
      var input = document.getElementById('quickAddInput');
      var name = input.value.trim();
      if(!name) return;
      var country = state.filters.country!=='all' ? state.filters.country : (state.countries[0]||'台灣');
      var category = state.filters.category!=='all' ? state.filters.category : 'other';
      addItem({ country:country, category:category, name:name, address:'', note:'' });
      input.value=''; render();
    });

    document.getElementById('topbar').addEventListener('input', function(e){
      if(e.target.id !== 'searchInput') return;
      state.filters.search = e.target.value; persistFilters(); renderList();
    });

    document.getElementById('fabAdd').addEventListener('click', openAddModal);

    window.addEventListener('online', function(){ state.online = true; render(); showToast('已恢復連線，開始同步…'); flushQueue(); });
    window.addEventListener('offline', function(){ state.online = false; render(); showToast('已離線'); });

    window.addEventListener('keydown', function(e){
      if(!state.lightbox) return;
      if(e.key==='Escape') closeLightbox();
      if(e.key==='ArrowLeft') lightboxNav(-1);
      if(e.key==='ArrowRight') lightboxNav(1);
    });

    if(window.matchMedia){
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
        if(state.theme === 'system') render();
      });
    }
  }

  /* ============ PWA service worker ============ */
  function registerSW(){
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }
  }

  /* ============ Init ============ */
  function init(){
    loadState();
    wireGlobalEvents();
    render();
    registerSW();
    if(state.gasUrl && state.online){ setTimeout(flushQueue, 400); }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
